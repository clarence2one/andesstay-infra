name: andesstay-mq-cluster

# Clúster RabbitMQ de 2 nodos del caso DSY1107 (EP6), elevado con docker-compose.
# rabbit1 crea la topología del sistema (colas q.cmd.*, exchanges cmd.direct y cmd.topic)
# y rabbit2 se une al clúster con el mismo Erlang cookie. La definición de usuarios se
# replica automáticamente al nuevo nodo porque RabbitMQ comparte el esquema del clúster.
#
# Uso: docker compose -f mq/compose-cluster.yml up -d
# AMQP: localhost:5672 (rabbit1) y localhost:5673 (rabbit2)
# UI:   http://localhost:15672 y http://localhost:15673

x-rabbit-common: &rabbit-common
  image: rabbitmq:3.13-management
  restart: unless-stopped
  environment: &rabbit-env
    RABBITMQ_ERLANG_COOKIE: ANDESSTAY_CLUSTER_COOKIE
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    RABBITMQ_NODE_PORT: 5672

services:
  rabbit1:
    <<: *rabbit-common
    container_name: andesstay-rabbit1
    hostname: rabbit1
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes: ["rabbit1-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbit2:
    <<: *rabbit-common
    container_name: andesstay-rabbit2
    hostname: rabbit2
    depends_on:
      rabbit1:
        condition: service_healthy
    ports:
      - "5673:5672"   # AMQP del segundo nodo
      - "15673:15672" # Management UI del segundo nodo
    volumes: ["rabbit2-data:/var/lib/rabbitmq"]
    # Se omite el entrypoint oficial a propósito: el usuario/default y la topología ya los
    # crea rabbit1 y se replican al unirse. Así podemos levantar el server y hacer join
    # en un solo contenedor.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -eu
        rabbitmq-server -detached
        until rabbitmqctl -n rabbit@rabbit1 await_startup; do sleep 2; done
        rabbitmqctl stop_app
        rabbitmqctl join_cluster rabbit@rabbit1
        rabbitmqctl start_app
        tail -f /dev/null
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  rabbit1-data:
  rabbit2-data:
